app-id: com.notepadqq.Notepadqq
base: io.qt.qtwebengine.BaseApp
base-version: '6.11'
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: notepadqq
rename-icon: notepadqq
rename-desktop-file: notepadqq.desktop
rename-appdata-file: notepadqq.appdata.xml
copy-icon: true
finish-args:
  # X11 + XShm access
  - --share=ipc
  - --socket=fallback-x11
  # Wayland access
  - --socket=wayland
  # Filesystem access
  # for Open Folder
  - --filesystem=home
  # Host command access
  # for flatpak-spawn
  # Allow to run commands from the host
  - --talk-name=org.freedesktop.Flatpak
  # OpenGL access
  # for QtWebKit (stable release) or QtWebEngine (beta release)
  - --device=dri

cleanup-commands:
  # Cleanup after QtWebKit
  - rm -rf /app/include
  - rm -rf /app/lib/{cmake,mkspecs,pkgconfig}

modules:
  - name: uchardet
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_STATIC=0
      - -DBUILD_BINARY=OFF
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: archive
        url: https://www.freedesktop.org/software/uchardet/releases/uchardet-0.0.8.tar.xz
        sha256: e97a60cfc00a1c147a674b097bb1422abd9fa78a2d9ce3f3fdcc2e78a34ac5f0
        x-checker-data:
          type: anitya
          project-id: 9265
          stable-only: true
          url-template: https://www.freedesktop.org/software/uchardet/releases/uchardet-$version.tar.xz
  - name: notepadqq
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/notepadqq/notepadqq/archive/v2.1.1.tar.gz
        sha256: f448ddef3f2c8e076f54e213cd4cbd3137979262878f8af15ce52d47d23b21ee
        x-checker-data:
          type: anitya
          project-id: 12071
          stable-only: true
          url-template: https://github.com/notepadqq/notepadqq/archive/v$version.tar.gz
    post-install:
      - install -p -D -m 0644 "COPYING" -t "${FLATPAK_DEST}/share/licenses/notepadqq/"

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
